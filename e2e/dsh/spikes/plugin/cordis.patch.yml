- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      spike:
        apiKeyEnv: DSHEE_TOKEN
        headers:
          X-DshEE-Client: dsh-connect/spike
        api: openai-completions
        baseURL: !!js process.env.SPIKE_LLM_URL
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: spike-model

- id: agent-default-model
  config:
    provider: spike
    model: spike-model

- id: session-title-llm
  disabled: true

- id: deepseek-account
  disabled: true

- id: credentials
  disabled: false

- id: authorization
  disabled: false

- id: hmr
  config:
    root: !!js process.env.SPIKE_PLUGIN_ROOT.split(',')

- insert:
    - id: dsh-ee-spikes
      name: '@dsh-ee/agent-connect-spikes'

