- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      spike:
        apiKeyEnv: DSHEE_TOKEN
        api: openai-completions
        baseURL: !!js process.env.SPIKE_LLM_URL
        models:
          - id: spike-model

- id: agent-default-model
  config:
    provider: spike
    model: spike-model

- id: session-title-llm
  disabled: true

- id: deepseek-account
  disabled: true

- id: credentials
  disabled: false

- id: authorization
  disabled: false

- insert:
    - id: dsh-ee-spikes
      name: '@dsh-ee/agent-connect-spikes'

